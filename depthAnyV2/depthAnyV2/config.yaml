# Depth Anything V2 度量深度项目 —— 所有脚本参数都放在这一个配置里
# 改这里就能调所有参数，不用动代码、也不用加命令行（命令行参数如果有会覆盖这里的值）

# 路径配置
paths:
  # 原始训练图片目录（放 JPG/PNG 图片）
  image_dir: datasets/my_dataset/images
  # 数据准备输出目录（prepare_data.py 生成伪标签）
  processed_dir: datasets/my_dataset/processed
  # 训练模型保存目录 (Stage 1 输出到独立目录，不覆盖现有 Stage 2 的 checkpoints/my_model)
  checkpoint_dir: checkpoints/my_model_stage1
  # 评估结果输出目录
  eval_dir: eval_results
  # 推理输入目录（放待验证图片/视频）
  detect_input: detect/input
  # 推理输出目录
  detect_output: detect/output

# 模型配置
model:
  # 教师模型（生成米数伪标签，越大越准）
  teacher: depth-anything/Depth-Anything-V2-Metric-Outdoor-Large-hf
  # 学生模型（实际微调的目标模型）
  student: depth-anything/Depth-Anything-V2-Metric-Outdoor-Base-hf
  # 评估基准模型（对比用，默认与学生相同）
  base: depth-anything/Depth-Anything-V2-Metric-Outdoor-Base-hf
  # 夜间去眩光教师（路线C）：低亮度图片先用 CLAHE 压高光再生成伪标签，公路过曝、车灯眩光场景建议开（默认 true）
  night_enhance: true

# 训练配置 (train.py)
train:
  # 训练阶段: 1=Head微调(快), 2=全量微调(慢但更精)
  stage: 1
  # 训练轮数 (Stage 1 只训 head，100 轮为常规设置，早停会按 patience 截断)
  epochs: 100
  # 批大小 (8GB显存建议1-2, 16GB可设4)
  batch_size: 4
  # 处理分辨率 (须为14的倍数, DA2默认518；448 提速~25%且精度损失可忽略)
  process_res: 448
  # 时序一致性损失权重（路线A）：0=禁用，一般给 0.1~0.3，约束相邻帧深度平滑（默认 0.2）
  temporal_weight: 0.2
  # 时序 loss 子采样间隔 (每 N 个 batch 做一次第二次前向，权重 ×N 自动补偿)
  # 2 = 省掉约 40% 训练时间，期望梯度不变
  temporal_every: 2
  # 夜间模拟增强触发概率（路线A）：0=禁用，0~1，低照度+眩光 bloom（默认 0.3）
  night_aug_prob: 0.3
  # 夜间眩光 bloom 模糊核大小（路线A）：给奇数，越大光晕越扩散，范围 5~21（默认 11）
  bloom_kernel: 11
  # 验证频率 (每 N 轮验证一次，N>1 省时；验证只评纯 SILog 不算时序 loss)
  val_every: 2
  # 早停耐心 (连续 N 次验证无改善则停止)
  patience: 7
  # 基础学习率：backbone 用这值，head 会自动 ×10（默认 5e-6）
  base_lr: 0.000005
  # 数据加载 worker 进程数：0=主进程加载，Windows 下多进程用 spawn（默认 6）
  num_workers: 6
  # 每个 worker 预取 batch 数，num_workers>0 时才生效（默认 4）
  prefetch_factor: 4
  # 随机种子：只管训练/验证集划分，保证能复现（默认 42）
  seed: 42
  # 早停最小改善幅度：验证 loss 改善小于这值就算没改善（默认 1e-4）
  min_delta: 0.0001
  # AdamW 权重衰减（默认 0.01）
  weight_decay: 0.01
  # SILog loss 方差惩罚系数 lambda（官方默认 0.5）
  loss_lambd: 0.5
  # LoRA 微调开关：true=冻结 ViT，只在 DPT head 的 1x1 卷积上加低秩适配（默认 false）
  lora: false
  # LoRA 秩：lora=true 时才生效，越大容量越大（默认 8）
  lora_rank: 8
  # 恢复训练的checkpoint路径 (null=从头开始)
  # 当前 Stage 1：resume=null，从预训练学生模型起训，epoch 从 1 开始计数
  # 中断后续跑：改为 checkpoints/my_model_stage1/latest_model.pt 即可从断点完整恢复
  # 以后跑 Stage 2 时再设为 Stage 1 的 best_model.pt 以继承权重，全量微调 backbone+head
  resume: null

# 评估配置 (evaluate.py)
eval:
  # 微调模型路径 (null=只评估预训练模型)
  checkpoint: checkpoints/my_model/best_model.pt
  # 是否同时运行预训练模型对比
  compare: true

# 推理配置 (detect.py)
detect:
  # 推理模型路径 (null=用预训练官方模型)
  model_depth: checkpoints/my_model/best_model.pt
  # 计算设备
  device: cuda
  # 视频帧采样间隔 (1=每帧都处理, 2=隔帧处理)
  frame_step: 1
  # 视频最大处理帧数 (null=处理全部)
  max_frames: null
  # 是否保存每帧深度数据 .npz (1=保存但慢, 0=不保存更快，只出视频，默认关闭)
  save_depth: 0

  # 预览模式配置
  # 是否启用预览模式：true=随机挑几个文件用 OpenCV imshow 显示、不落盘，省内存（默认 true）
  preview_enabled: true
  # 随机抽取的文件数量：只在 preview_enabled=true 时生效，0 就是全部处理（这里设 20）
  preview_count: 20

  # 像素点深度监测配置
  # 是否启用自定义像素点深度监测：true=在视频里标出指定像素点、实时显示深度（默认 true）
  pixel_depth_enabled: true
  # 监测像素点列表：格式 "x1,y1;x2,y2"，分号隔开多个点，只在 pixel_depth_enabled=true 时生效
  # 留空就在画面中分线上均匀铺 pixel_depth_count 个点，比如 "320,240;640,480;800,600" 是 3 个自定义点（默认空）
  pixel_depth_points: ""
  # 自动生成的监测点数量：只在 pixel_depth_points 为空时派上用场
  # 15=非对称双列，x=40 共 7 点 + x=55 共 8 点；14=对称双列，两边各 7 点（聚合模式）；7=x=40 单列 7 点
  pixel_depth_count: 15

# 车辆检测配置 (detect_car.py)
car_detect:
  # 输入目录（放待检测视频，支持子目录递归读取）
  input_dir: detect/input
  # 输出根目录（每次运行在其下创建带时间戳的子目录）
  output_dir: detect/car_output
  # 随机选取的视频数量：输入是目录时随机抽 N 个视频，0=全部处理（这里设 150）
  preview_count: 150
  # 处理帧采样间隔：1=每帧都处理，2=隔帧，以此类推；越大越快但精度会掉，也决定截取帧的密度（默认 1）
  frame_step: 1
  # 随机种子：null=每次随机，填整数就可复现（默认 null）
  seed: null

  # YOLO 视觉检测配置
  yolo:
    # 是否启用 YOLO 视觉检测：跟深度规则配合用，不是独立跑的（默认 true）
    enabled: true
    # YOLO 模型文件路径（.pt 权重）：自定义训的 best.pt 或官方 yolov8n.pt 都行
    # 一般是把 .pt 丢进 checkpoints/yolo/（这个目录已经建好），这里写相对路径，比如 checkpoints/yolo/best.pt
    model_path: checkpoints/yolo/best.pt
    # 计算设备: cuda / cpu（默认与深度模型相同）
    device: ""
    # 置信度阈值(0~1): 低于此值的 YOLO 检测框被忽略
    confidence: 0.40
    # IoU NMS 阈值(0~1): 去重检测框
    iou: 0.45
    # 你自定义训练的模型类别编号（车 = 类别0）
    # 如果是多类别自定义模型，把所有代表"车辆/卡车/公交/摩托"的编号写进来
    vehicle_classes: [0]
    # 车辆进入检测区域判定：
    # 检测框底部与画面底部距离占比阈值（越小表示越靠近底部/检测线）
    # 例 0.30: 检测框底部在画面下方 30% 范围内时视为进入检测区
    enter_bottom_ratio: 0.30
    # 检测框最小尺寸占比(0~1): 过滤远处极小的误检框
    min_box_ratio: 0.02
    # 过线容差(像素)：YOLO 检测框左沿到检测线 x + 容差 才算进视觉分，范围 0~80（默认 15）
    # 车辆从画面右侧驶来，车只是靠近但还没到检测线(x=40)时不触发视觉判定
    # 给大了判得早、可能误报，给小了太严、框一抖就可能闪断
    cross_tolerance_px: 15

  # MLP 判定模型集成（实验性，可一键停用）
  # enabled=false 时完全不加载模型，detect 走原 v8 逻辑，零影响
  # 设为 true 后，若模型加载失败或推理异常，自动回退 v8
  judge_mlp:
    # 2026-10-12 M6 开关层实测：当前 judge_mlp.pt 会把有车帧全部纠正为 no_car
    # （主视频 car=21 → car=0），模型训练到位前保持关闭；透传能力已保留，训好后再开
    enabled: false
    model_path: checkpoints/judge_model/judge_mlp.pt
    # 时序窗口（与训练时一致，默认 5）
    window: 5
    device: ""

  # 多规则融合权重配置（深度变化+视觉高权重，合计 90%）
  # 所有权重总和 = 1.00 (100%)
  weights:
    # 深度变化相关 (高权重，合计 70%)
    R1_way4_depth_jump: 0.10    # Way4 深度骤变检测
    R2_way5_abs_depth: 0.25     # Way5 绝对深度分布 (原 R2，主规则)
    R3_way1_baseline: 0.25      # Way1 基线对比下降 (原 R3，主规则)
    R4_vehicle_region: 0.10     # Way 车辆区域统计特征
    # 视觉检测 (高权重，合计 20%)
    R5_yolo_vision: 0.30        # R5: YOLO 视觉检测 - 车+进入检测区

  # 加权综合判定阈值：≥这值就算有车，置信度 0~1（默认 0.470）
  car_confidence_threshold: 0.470

  # 夜间自适应（车头光源干扰优化·先止血）
  # 夜间深度模型受车灯眩光/低可见度影响导致检测不稳定，
  # 通过时序平滑 + 放宽确认门槛 + 延长冷却期降低夜间误报与闪断。
  night:
    # 是否启用夜间自适应（默认 true）
    enabled: true
    # 亮度阈值(0-255): 平均灰度低于这值就算夜间，范围 30~150（默认 80.0）
    bright_threshold: 80.0
    # 时序平滑系数(0~1): 夜间道路深度的 EMA 混合比例，越小越平滑，范围 0.0~0.6（默认 0.35）
    smooth_alpha: 0.35
    # 夜间额外确认帧数: 有车门槛 = car_confirm_frames + 这个值，范围 0~5（默认 2）
    confirm_extra: 2
    # 夜间额外冷却帧数: 车辆离开冷却期 = car_exit_cooldown_frames + 这个值，范围 0~60（默认 10）
    cooldown_extra: 10

  # 监测点饱和屏蔽（过曝像素丢弃）
  # 车灯直射把监测点打曝了，深度推理就不靠谱，这种点直接丢掉；设 0 就是关掉这个屏蔽，范围 0~255（默认 235）
  # 2026-10-14: 235 → 250，白天白色车厢/亮部也会过 235 被误屏蔽（nanm 点变多），250 只挡真正爆掉的像素
  saturation_threshold: 250
  # 过曝屏蔽只在夜间生效：白天白色车身像素也会顶到 255，不分昼夜屏蔽会把关键监测点全打成 nan 漏判车（默认 true）
  sat_night_only: true

  # 一车一信号（微波替代场景）
  # 深度孤立尖峰过滤：单点比上一帧跳变超过该米数、且其他点没联动（<30%点同向）就当噪声丢掉；0=关闭（默认 8.0）
  spike_abs_threshold: 8.0
  # 有车确认后的状态锁帧数：锁内不允许回退，防"刚确认就闪退再闪进"造成重复信号（默认 10）
  min_car_hold_frames: 10
  # 两次有车信号的最小间隔帧数：间隔小于它的信号算重复直接吞（默认 15 ≈0.5s@30fps）
  # 必须小于"离场确认(5帧)+冷却+确认"的最短通路，否则会把紧随的后车信号吞掉
  min_signal_interval_frames: 15
  # 车辆离场后的冷却帧数：冷却期内不确认新车。本系统按微波信号替代标定：
  # 15≈0.5s，最小可分辨跟车间隔≈离场确认(5帧)+冷却≈0.67s@30fps；
  # 改大更防噪但跟车近了会并车丢车（默认 15，尖峰过滤已上岗，短冷却不怕噪声）
  car_exit_cooldown_frames: 15
  # 基线救援帧数：视频开头就有车占线、预热一直收不到无车帧导致基线建不起来时，
  # 第 N 帧用"逐点历史最大深度"兜底当基线（路面=该点能看到的最远距离，遮挡只会更近），
  # 没有它状态机会永久卡在 car（多车共用一个信号）；0=关闭（默认 30 ≈1s@30fps）
  baseline_rescue_frames: 30

  # 基线上浮校正帧数：深度只会被遮挡压小、不可能比路面更远；某监测点连续 N 帧
  # 高于基线超过 max(正常波动×2, 2.0m) → 说明基线被"从未见过路面的点"污染（救援兜底
  # 拿到的是车深），把基线抬回当前观测值；没有它污染点会一直撑着规则分数，退出判不了
  # （默认 10 帧 ≈0.33s@30fps）；0=关闭
  baseline_up_snap_frames: 10

  # 基线下沉校正帧数：与上浮校正对称——深度比基线更近不一定是车，也可能是
  # 救援兜底基线被深度噪声抬高 0.5~1m 形成的"假下降"（噪声 max 统计天然偏高），
  # 这种亚米级假下降会撑着 R1/R3 分数让退出判不了、信号锁存。
  # 某监测点连续 N 帧低于基线、且偏差落在 (0.3, max(正常波动, 1.5)] 米这个"亚米级"区间
  # → 压回观测值；真车下降是米级（超出区间上限）不受影响（默认 10 帧 ≈0.33s@30fps）；0=关闭
  baseline_down_snap_frames: 10

  # CLAHE 去眩光（Lab 空间 L 通道局部对比度均衡）
  clahe:
    # 是否对推理帧做 CLAHE 预处理（先关着，看看夜间自适应效果再决定，默认 false）
    enabled: false
    # 对比度限制阈值，范围 1.0~4.0（默认 2.0）
    clip_limit: 2.0
    # 网格大小，范围 4~16（默认 8）
    tile_grid_size: 8

  # 背景基线目录（可选，用于预设深度基线）
  # 配置后，detect 启动时会递归扫描该目录下的背景图片/视频，
  # 取其深度作为车辆检测的基线，跳过视频前几帧预热。
  # 适用于：视频开头就有车导致基线被污染的场景。
  # 留空或不配置 → 使用原逻辑（视频前 baseline_warmup 帧预热）
  # 背景要求：同一摄像头、无车、尽量覆盖不同光照（白天/黄昏/夜晚）
  baseline_dir: ""
  # 从背景视频中最多抽取的帧数（图片不受此限制，全部使用）
  baseline_max_frames: 30

  # 距离骤减阈值(m): 单个点深度掉得超过这值就算被车挡了，范围 0.1~10.0（默认 0.4）
  # 非对称双列模式下车辆远、深度变化小，阈值要相应调低
  distance_drop_threshold: 0.4
  # 正常波动阈值(m): 单个点深度偏差小于这值就算稳定，范围 0.2~3.0（默认 1.5）
  # 深度模型本身有误差，这值给小了很多点会被当成不稳
  normal_fluctuation: 1.5
  # 判有车至少要几个点一起骤减（多点投票）：至少 2 个点同时异常才认，不然单点噪声就误判了（默认 2）
  min_car_points: 2
  # 判无车至少要几个点稳定（多数稳定，只算路面可靠的点）：不用全稳，多数稳就行（默认 3）
  min_stable_points: 3
  # 参与判车的最大基线深度(m): 超过这值的点当天空/远景，不参与判车，范围 5.0~80.0（默认 30.0）
  # 深度模型对天空估得极不准，必须滤掉
  max_detect_depth: 30.0
  # 相对跌幅阈值(0~1): 深度跌幅得同时过绝对和相对两个阈值，范围 0.02~0.8（默认 0.08）
  # 车辆远的时候相对跌幅不明显，阈值要调低
  relative_drop_threshold: 0.08
  # 有车确认帧数: 连续 N 帧都骤减才认有车，范围 1~5（默认 3）
  # 防单帧深度噪声、邻车干扰误判，所以要连续 3 帧确认
  car_confirm_frames: 3
  # 无车确认帧数: 连续 N 帧稳定才认无车，范围 1~10（默认 5）
  # 得确认真的稳了才判无车，防一下子波动
  stable_confirm_frames: 5
  # 基线预热帧数: 取前 N 帧的中位数当初始背景深度基线，范围 3~30（默认 5）
  baseline_warmup: 5
  # 基线 EMA 更新系数(0~1): 无车时基线平滑更新，越小越稳，范围 0.01~0.3（默认 0.05）
  baseline_alpha: 0.05

  # 截取帧图像格式: jpg 或 png（默认 jpg）
  image_format: jpg
  # JPEG 保存质量(1-100): 只在 image_format=jpg 时有效（默认 95）
  jpeg_quality: 95
  # 是否保存可视化对比图（原图+深度图+状态标注，默认 true）
  save_visualization: true

  # MOG2 运动检测配置
  # 基于 MOG2 背景减除，检测运动目标是否经过检测线（与深度检测配合使用）
  # 融合逻辑(v4): 深度检测到car→直接有车 | 深度unknown+MOG2确认+深度变化验证→有车 | 深度no_car→不受MOG2影响
  mog2:
    # 是否启用 MOG2 运动检测（默认 true）
    enabled: true
    # 检测带宽度(像素): 以检测线为中心的垂直窄带，加宽点能少些噪声干扰，范围 10~100（默认 30）
    strip_width: 30
    # 最小运动像素数: 检测带内前景像素超过这值才算有运动目标，基础值、会被亮度权重动态调整，范围 10~500
    # 降到 20 是为了提高远距离车辆的灵敏度
    min_motion_pixels: 20
    # MOG2 历史帧数: 背景模型的历史长度，范围 50~1000（默认 300）
    history: 300
    # MOG2 方差阈值: 像素跟背景模型的方差阈值，范围 5~100（默认 25）
    var_threshold: 25
    # 是否检测阴影 (true=检了可能误判, false=不检更稳，默认 false)
    detect_shadow: false
    # 预热帧数: 前 N 帧先不检测（背景模型还没稳），夜间场景建议加大，范围 10~100（默认 30）
    warmup_frames: 30
    # 确认帧数: 连续 N 帧检测到运动才确认有目标，基础值、会被亮度权重动态调整，范围 1~10（默认 3）
    confirm_frames: 3

    # 动态亮度权重配置
    # 根据环境亮度自动调整 MOG2 判定灵敏度：
    # 夜间(低亮度)→深度模型不可靠→MOG2权重高→更敏感
    # 白天(高亮度)→深度模型可靠→MOG2权重低→更严格
    brightness:
      # 高亮度阈值(0-255): 高于这值算白天，范围 120~255（默认 180.0）
      bright_high: 180.0
      # 中亮度阈值(0-255): 低于这值算夜间，范围 30~150（默认 80.0）
      bright_mid: 80.0
      # 白天 MOG2 最小权重(0~1): 权重越低越严格，范围 0.2~0.6（默认 0.4）
      min_weight: 0.4
      # 夜间 MOG2 最大权重(0~1): 权重越高越敏感，范围 0.7~1.0（默认 1.0）
      max_weight: 1.0
      # 权重 EMA 平滑系数(0~1): 越小过渡越平滑，范围 0.01~0.2（默认 0.05）
      weight_alpha: 0.05
      # 日志记录间隔(帧数): 每 N 帧记一次亮度和权重，范围 10~500（默认 50）
      log_interval: 50

# 深度学习分类器配置 (detect/training/train_classifier.py)
classifier:
  # 数据集目录（里面必须有 car/ 和 no_car/ 两个子文件夹，默认 detect/training/dataset）
  data_dir: detect/training/dataset
  # 模型输出目录（默认 checkpoints/classifier）
  output_dir: checkpoints/classifier

  # 数据集配置
  # 图像尺寸：必须能被 14 整除，范围 128~512（默认 224）
  img_size: 224
  # 训练集比例，范围 0.5~0.95（默认 0.8）
  train_ratio: 0.8
  # 验证集比例，范围 0.05~0.3（默认 0.1）
  val_ratio: 0.1
  # 测试集比例 = 1 - train_ratio - val_ratio；随机种子，保证能复现（默认 42）
  random_seed: 42

  # 模型配置
  # 模型架构: efficientnet_b0 / resnet18 / resnet50 / mobilenet_v3_small / vit_b_16（默认 efficientnet_b0）
  model_name: efficientnet_b0
  # 使用预训练权重（默认 true）
  pretrained: true
  # 冻结骨干网络，只训分类头（默认 false）
  freeze_backbone: false
  # Dropout 比率，范围 0.1~0.9（默认 0.5）
  dropout_rate: 0.5

  # 训练配置
  # 训练轮数，范围 5~500（默认 50）
  epochs: 50
  # 批处理大小：按显存来调，范围 1~128（默认 32）
  batch_size: 32
  # 学习率，范围 0.0001~0.01（默认 0.001）
  learning_rate: 0.001
  # 权重衰减，范围 0~0.01（默认 0.0001）
  weight_decay: 0.0001
  # 优化器: adamw / adam / sgd（默认 adamw）
  optimizer_name: adamw
  # 学习率调度器: cosine / step / reduce（默认 cosine）
  scheduler_name: cosine

  # 数据增强配置
  # 启用数据增强（默认 true）
  augmentation: true
  # 水平翻转概率，范围 0~1（默认 0.5）
  hflip_prob: 0.5
  # 垂直翻转概率，范围 0~1（默认 0.1）
  vflip_prob: 0.1
  # 旋转角度范围(度)，范围 0~45（默认 15）
  rotation_deg: 15
  # 亮度调整因子，范围 0~0.5（默认 0.2）
  brightness_factor: 0.2
  # 对比度调整因子，范围 0~0.5（默认 0.2）
  contrast_factor: 0.2

  # 早停配置
  # 启用早停（默认 true）
  early_stopping: true
  # 耐心值：多少轮没改善就停，范围 3~30（默认 10）
  patience: 10
  # 最小改善幅度，范围 0~0.1（默认 0.001）
  min_delta: 0.001

  # 保存配置
  # 检查点保存间隔(epoch)，范围 1~20（默认 5）
  save_interval: 5

  # 类别配置
  # 类别名称，按顺序对应文件夹（默认 [no_car, car]）
  class_names:
    - no_car
    - car
  # 类别到索引的映射
  class_to_idx:
    no_car: 0
    car: 1

# 判定 MLP 训练配置 (train_judge.py)
judge:
  # 最大训练轮数（默认 100）
  epochs: 100
  # batch size（默认 256）
  batch: 256
  # 时序窗口帧数：1=单帧，5=拼前 5 帧特征（默认 5）
  window: 5
  # 学习率（默认 0.001）
  lr: 0.001
  # AdamW 权重衰减（默认 1e-4）
  weight_decay: 0.0001
  # Dropout，防过拟合（默认 0.3）
  dropout: 0.3
  # 早停耐心：连续 N 轮验证 loss 不降就停（默认 15）
  patience: 15
  # 随机种子（默认 42）
  seed: 42
  # 验证视频占比：按视频分组划分（默认 0.2，即 20%）
  val_video_frac: 0.2