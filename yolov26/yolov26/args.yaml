# ============================================
# YOLOv26 训练配置文件
# 功能: 定义模型训练的所有超参数和配置选项
# 适用任务: 车辆检测（car类别）
# ============================================


# ==================== 基础配置 ====================
task: detect              # 任务类型: detect(检测) / segment(分割) / classify(分类) / pose(姿态)
mode: train               # 运行模式: train(训练) / val(验证) / predict(预测) / export(导出)
model: "/home/fst/zzy work/yolov26/yolo26s.pt"         # 预训练模型路径（绝对路径，路径含空格需用引号）
data: "/home/fst/zzy work/yolov26/data.yaml"             # 数据集配置文件路径（绝对路径，路径含空格需用引号）


# ==================== 训练超参数 ====================
epochs: 100               # 训练总轮数，即模型遍历完整数据集的次数
patience: 10              # 早停耐心值：验证集性能连续多少轮无提升则停止训练
batch: 8                  # 批次大小：每批处理的图像数量（根据GPU显存调整）
imgsz: 640                # 输入图像尺寸（像素），模型将把所有图像缩放到此尺寸


# ==================== 保存与缓存配置 ====================
save: true                # 是否保存训练结果（权重、配置文件等）
save_period: -1           # 保存周期：每隔多少轮保存一次模型，-1表示仅在训练结束时保存
cache: false              # 是否启用数据缓存：true可加速训练但消耗更多内存


# ==================== 硬件配置 ====================
device: 0                 # 使用的GPU设备ID，0表示第一块GPU，'cpu'表示使用CPU
workers: 4                # 数据加载线程数，用于并行加载数据


# ==================== 输出配置 ====================
project: "/home/fst/zzy work/yolov26/output"         # 项目根目录，用于保存训练结果（绝对路径）
name: exp-det             # 实验名称，训练结果将保存在 project/name 目录下
exist_ok: false          # 是否允许覆盖已存在的同名实验目录（false=每次生成新目录如exp-det2, exp-det3）


# ==================== TensorBoard 配置 ====================
# 注意: TensorBoard 日志由 Ultralytics 自动生成，无需额外配置
# 日志文件默认保存在 output/exp-det/ 目录下
# 使用方法: tensorboard --logdir=output/exp-det --port=6006
plots: true               # 是否生成训练过程中的可视化图表

# ==================== 训练策略配置 ====================
pretrained: true          # 是否使用预训练权重进行训练
optimizer: AdamW          # 优化器类型：SGD / Adam / AdamW / RMSProp
verbose: true             # 是否打印详细训练日志
seed: 66                  # 随机种子，确保实验可复现
deterministic: true       # 是否启用确定性训练，确保结果可复现


# ==================== 数据配置 ====================
single_cls: true          # 是否将所有类别视为单一类别进行训练（适用于单类别检测）
rect: false               # 是否使用矩形训练：根据图像实际长宽比填充，减少无用计算


# ==================== 学习率策略 ====================
cos_lr: true              # 是否使用余弦退火学习率策略：学习率按余弦函数逐渐降低


# ==================== 增强策略配置 ====================
close_mosaic: 10          # 在训练的最后N轮关闭马赛克增强，使模型适应正常图像
augment: true             # 是否启用数据增强


# ==================== 训练控制 ====================
resume: false             # 是否从上次中断处恢复训练
amp: true                 # 是否启用自动混合精度训练（加速训练，减少显存占用）
dropout: 0.0              # Dropout正则化比例，0表示不使用Dropout


# ==================== 验证配置 ====================
val: true                 # 是否在训练期间进行验证
split: val                # 验证集划分：val(验证集) / test(测试集)
save_json: false          # 是否保存验证结果为JSON格式（用于COCO评估）
save_hybrid: false        # 是否保存混合标签格式


# ==================== 推理配置 ====================
conf: 0.25                # 置信度阈值：低于此阈值的检测结果将被过滤
iou: 0.72                 # NMS的IoU阈值：用于去除重叠检测框
agnostic_nms: false       # 是否使用类别无关的NMS（对所有类别统一进行NMS）
classes: null             # 指定要检测的类别索引列表，null表示检测所有类别


# ==================== 分割相关配置 ====================
retina_masks: true        # 是否使用RetinaNet风格的掩膜预测


# ==================== 导出配置 ====================
boxes: true               # 导出时是否包含检测框
format: torchscript       # 导出格式：torchscript / ONNX / TensorRT / CoreML 等
keras: false              # 是否使用Keras格式
optimize: false           # 是否优化导出模型
int8: false               # 是否导出为INT8量化模型
dynamic: false            # 是否启用动态形状导出
simplify: false           # 是否简化ONNX模型
opset: null               # ONNX算子集版本，null表示使用默认版本
workspace: 4              # TensorRT导出时的工作空间大小（GB）
nms: false                # 导出时是否包含NMS操作


# ==================== 优化器超参数 ====================
lr0: 0.0009               # 初始学习率
lrf: 0.01                 # 最终学习率占初始学习率的比例（cos_lr策略下）
momentum: 0.937           # SGD动量
weight_decay: 0.0006      # 权重衰减（L2正则化），防止过拟合


# ==================== 热身训练配置 ====================
warmup_epochs: 3.0        # 热身训练轮数：训练初期使用较小学习率逐渐增加
warmup_momentum: 0.8      # 热身期间的动量值
warmup_bias_lr: 0.01      # 热身期间偏置的学习率


# ==================== 损失函数权重 ====================
cls: 1.2                  # 分类损失权重
box: 7.5                  # 边界框回归损失权重
dfl: 1.5                  # 分布焦点损失权重（用于边界框回归）


# ==================== 正则化配置 ====================
label_smoothing: 0.03     # 标签平滑系数，防止模型过于自信
nbs: 64                   # 名义批次大小（用于梯度累积）


# ==================== 数据增强参数（HSV色彩空间）====================
hsv_h: 0.015              # HSV色调扰动范围（0-1）
hsv_s: 0.7                # HSV饱和度扰动范围（0-1）
hsv_v: 0.4                # HSV亮度扰动范围（0-1）


# ==================== 几何变换增强参数 ====================
degrees: 10.0             # 随机旋转角度范围（-10°到10°）
translate: 0.1            # 随机平移比例（相对于图像尺寸）
scale: 0.22               # 随机缩放比例范围
shear: 0.1                # 随机剪切角度范围（弧度）
perspective: 0.001        # 随机透视变换强度
flipud: 0.0               # 上下翻转概率（0表示不翻转）
fliplr: 0.5               # 左右翻转概率（0.5表示50%概率翻转）


# ==================== 高级增强参数 ====================
mosaic: 0.8               # 马赛克增强概率：将4张图像拼接成一张
mixup: 0.0                # MixUp增强概率：将两张图像混合
copy_paste: 0.0           # 复制粘贴增强概率：将目标从一张图像复制到另一张


# ==================== 跟踪器配置 ====================
tracker: botsort.yaml     # 目标跟踪器配置文件