# ============================================
# YOLOv26 数据集配置文件
# 功能: 定义训练和验证数据集的路径及类别信息
# 适用任务: 车辆检测（car类别）
# ============================================


# ==================== 数据集路径配置 ====================
# 使用相对路径（基于项目根目录）
path: .                        # 数据集根目录（相对于本 yaml 文件所在位置）
train: "dataset/images/train"  # 训练集图像目录路径
val: "dataset/images/val"      # 验证集图像目录路径
test: "dataset/images/test"    # 测试集图像目录路径（可选）


# ==================== 类别配置 ====================
nc: 1                             # 类别数量（number of classes）
names: ["car"]                    # 类别名称列表，与 nc 对应


# ==================== 注意事项 ====================
# 标签文件需与图像文件同名，存放在 dataset/labels/train/ 和 dataset/labels/val/ 目录下
# 标签格式：<类别索引> <归一化x_center> <归一化y_center> <归一化宽度> <归一化高度>
# 示例：0 0.672222 0.539375 0.655556 0.428750